name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # NOTE: The RPC tests under __tests__/rpc/ require a live Supabase
      # (SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY). To run
      # them in CI, add a `supabase start` service step and export those env
      # vars before this step. Without them, these tests skip themselves (see
      # the skip guard in the test files), so the default `vitest run` is safe.
      - name: Test
        run: npx vitest run
